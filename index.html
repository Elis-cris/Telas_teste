<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>projeto login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

    <main class="w-100 px-3" style="max-width: 400px;">

        <div class="bg-white p-4 p-sm-5 rounded-4 shadow-sm border border-light-subtle">
            <form>

                <!--  acho que tenho que tirar logon-->
                <h1 class="fs-4 fs-sm-3 fw-bold text-center text-dark mb-4"> ChaveMestra</h1>

        <div class="mb-3">
        <div class="input-group">
            <span 
            class="input-group-text bg-light text-secondary">
            <i class="bi bi-person-fill"></i>
        </span>
            <input placeholder="Usuário" type="text" class="form-control form-control-lg fs-6">
        </div>
    </div>

    <div class="mb-3">
        <div class="input-group">
            <span

        </span>

    </div>      

                <div

                        <input type="checkbox" class="form-check-input" id="lembrar">

                    </div>
                    <a href="#" class="text-primary text-decoration-none fw-medium link-hover">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fs-6 fw-semibold mb-3 py-2">Login</button>

                <div class="text-center fs-7 text-secondary">
                    <p class="mb-0">Não tem uma conta? <a href="#"
